<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoTeDico - Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-blue-600 p-4 text-white">
        <div class="container mx-auto">
            <h1 class="text-2xl font-bold">MoTeDico</h1>
            <p class="text-sm">Il GitHub dei consigli collaborativi</p>
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-semibold mb-4">Crea un nuovo progetto</h2>
                <form action="/projects" method="post" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Titolo</label>
                        <input type="text" name="title" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Descrizione</label>
                        <textarea name="description" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 h-32"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tuo Nome</label>
                        <input type="text" name="owner" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Pubblica</button>
                </form>
            </section>

            <section>
                <h2 class="text-xl font-semibold mb-4">Progetti</h2>
                <div class="space-y-4" hx-get="/" hx-trigger="every 5s" hx-select="section > div">
                    {% for project in projects %}
                    <div class="bg-white p-4 rounded shadow">
                        <h3 class="text-lg font-bold text-blue-600"><a href="/projects/{{ project.id }}">{{ project.title }}</a></h3>
                        <p class="text-gray-600 text-sm">Creato da {{ project.owner }}</p>
                        <div class="mt-2 text-sm flex space-x-4">
                            <span>{{ project.proposals|length }} Proposte</span>
                            <span class="font-bold uppercase text-green-600">{{ project.status }}</span>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </section>
        </div>
    </main>
</body>
</html>
